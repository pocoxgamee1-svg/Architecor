<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Australia Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#f6eeee;--mute:#aa9a9d;--glass:rgba(24,15,18,.62);--line:rgba(255,255,255,.11);--red:#ff3d3d;--red2:#c8101e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#120c0e}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#120c0e;color:var(--ink);font:400 15px/1.45 'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(12,7,9,.28),rgba(12,7,9,.7)),var(--bgimg) center/cover no-repeat}
.bear{position:fixed;z-index:0;right:-16vmin;top:24vh;width:86vmin;max-width:520px;opacity:.22;mix-blend-mode:screen;pointer-events:none;animation:drift 38s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{0%{transform:translate(-4vw,6vh) rotate(-7deg) scale(1)}50%{transform:translate(-14vw,-6vh) rotate(4deg) scale(1.08)}100%{transform:translate(-2vw,-14vh) rotate(-3deg) scale(.96)}}
@media (prefers-reduced-motion:reduce){.bear{animation:none}.scr.on{animation:none}}
#app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:16px 16px 28px}
.scr{display:none}.scr.on{display:block;animation:in .2s ease}
@keyframes in{from{opacity:0}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px}
.av{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ff4a4a,#a30d1a);display:grid;place-items:center;font:700 20px 'Unbounded',sans-serif}
.brand b{display:block;font:600 16px 'Golos Text',sans-serif}.brand span{color:var(--mute);font-size:13px}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:#2fd36b;box-shadow:0 0 8px #2fd36b}
h1{font:700 26px/1.18 'Unbounded',sans-serif;letter-spacing:-.02em;margin:34px 0 12px}
.sub{color:var(--mute);margin:0 0 26px;max-width:32ch}
.sec-t{font-weight:600;color:var(--mute);margin:0 0 10px 2px;font-size:14px}
.games{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:18px}
.game{padding:14px;text-align:left;display:flex;flex-direction:row;align-items:center;gap:14px;border:1px solid var(--line)}
.game:active,.row:active,.srv:active{transform:scale(.98)}
.logo{width:56px;height:56px;border-radius:15px;background:#161012;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}.logo svg{width:36px;height:36px}
.gn{font:600 12.5px 'Unbounded',sans-serif;line-height:1.25}.gs{color:var(--mute);font-size:12.5px;margin-top:3px}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:13px;width:100%;padding:13px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;font-weight:500}
.row:first-child{border-top:0}
.row .ch{margin-left:auto}
.ic{width:38px;height:38px;flex:none;border-radius:12px;background:rgba(255,61,61,.12);border:1px solid rgba(255,61,61,.38);display:grid;place-items:center}
svg.i{width:20px;height:20px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ch svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.legal{color:#85787b;font-size:12px;text-align:center;margin:20px 6px 0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.back{width:46px;height:46px;flex:none;border-radius:14px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center}
.back svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lab{margin:0;color:var(--mute);font-size:13px}
h2{margin:2px 0 0;font:700 21px/1.2 'Unbounded',sans-serif;letter-spacing:-.01em}
.chip{display:inline-flex;gap:8px;padding:8px 14px;border-radius:99px;font-size:13px;margin-bottom:16px;color:var(--mute)}.chip b{color:var(--ink);font-weight:600}
.btn{display:block;width:100%;padding:17px;border-radius:16px;border:1px solid var(--line);font:600 15px 'Golos Text',sans-serif;margin-bottom:12px}
.pri{background:linear-gradient(135deg,#ff4a4a,var(--red2));border-color:#ff7070;color:#fff;box-shadow:0 12px 32px -10px rgba(255,50,50,.6)}
.sec{background:var(--glass)}
.note{color:var(--mute);font-size:13px;text-align:center;margin:14px 8px 0}
.fld{display:block;width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:16px 'Golos Text',sans-serif;outline:none;margin-bottom:12px}
.fld::placeholder{color:#8d7f82}
.fld:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,61,61,.18)}
.fld.bad{border-color:#ff7070;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.srvs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srv{padding:15px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px;font:600 14px 'Golos Text',sans-serif;border:1px solid var(--line);overflow:hidden}
.srv span{overflow:hidden;text-overflow:ellipsis}
.srv svg{width:16px;height:16px;flex:none;stroke:var(--red);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:26px 10px}
.card{padding:6px 16px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.kv.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:13px;font-size:18px}.kv.tot span{color:var(--ink)}.kv.tot b{color:#ff6767}
.blk{padding:14px 16px 16px;margin-bottom:12px}.blk h3{margin:0 0 10px;font:600 14px 'Golos Text',sans-serif}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:14px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:500;font-size:14px}
.seg button.act{background:linear-gradient(135deg,#ff4a4a,var(--red2));border-color:#ff7070;color:#fff}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0}
.fl{display:block;color:var(--mute);font-weight:500;font-size:13px;margin:6px 0 7px 2px}
.sheet{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,2,3,.6)}
.sheet[hidden]{display:none}
.sh{width:100%;max-width:460px;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:#1a1114;border:1px solid var(--line);animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh h3{margin:0 0 10px;font:700 18px 'Unbounded',sans-serif}.sh p{margin:0 0 8px;color:#d9cdcf}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:9;background:#2a1519;border:1px solid #ff7070;padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="bg"></div>
<img class="bear" id="bear" alt="">
<main id="app">
  <section id="home" class="scr on">
    <div class="brand">
      <div class="av">A</div>
      <div><b>Australia Shop</b><span>Цифровые товары</span></div>
      <div class="pill glass"><i class="dot"></i>24/7</div>
    </div>
    <h1>Вирты быстро<br>и качественно.</h1>
    <p class="sub">Выберите игру — остальное займёт пару минут.</p>
    <p class="sec-t">Выберите игру</p>
    <div class="games" id="games"></div>
    <div class="list glass" id="info"></div>
    <p class="legal">Сервис не связан с правообладателями игровых проектов. Названия и логотипы используются только для обозначения игр.</p>
  </section>
  <section id="action" class="scr"></section>
  <section id="servers" class="scr"></section>
  <section id="order" class="scr"></section>
</main>
<div class="sheet" id="sheet" hidden><div class="sh" id="sh"></div></div>
<div class="toast" id="toast"></div>

  if(k==='support'){chat('Здравствуйте! Нужна помощь.');return}
  const s=SHEETS[k];
  $('#sh').innerHTML='<h3>'+s[0]+'</h3>'+s[1].split('|').map(p=>'<p>'+p+'</p>').join('')+'<button class="btn pri" style="margin:14px 0 0" onclick="closeSheet()">Понятно</button>';
  $('#sheet').hidden=false;
}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* action */
function pickGame(i){
  st.game=GAMES[i];st.server=null;
  $('#action').innerHTML=head('Выбор действия',st.game.name)+
   '<button class="btn pri" onclick="pickMode(\'buy\')">Купить вирты</button><button class="btn sec" onclick="pickMode(\'sell\')">Продать вирты</button><p class="note">Покупка открывает оформление заказа. Продажа оформляется как заявка менеджеру в Telegram.</p>';
  go('action');
}
function pickMode(m){st.mode=m;renderServers();go('servers')}

/* servers */
function renderServers(){
  const g=st.game,buy=st.mode==='buy',lab=buy?'Купить вирты':'Продать вирты';
  if(!g.servers){
    $('#servers').innerHTML=head(lab,'Выбор сервера')+'<div class="blk glass"><h3>Серверы уточняет менеджер</h3><p class="hint" style="margin:0 0 14px">Для этой игры оформление проходит в чате. Напишите менеджеру — он поможет.</p><button class="btn pri" style="margin:0" onclick="chat(\'Здравствуйте! Хочу '+(buy?'купить':'продать')+' валюту. Игра: '+g.name+'\')">Написать менеджеру</button></div>';
    return;
  }
  $('#servers').innerHTML=head(lab,'Выбор сервера')+'<input class="fld" id="q" type="search" placeholder="Поиск сервера…" autocomplete="off"><div class="srvs" id="grid"></div>';
  const draw=()=>{
    const q=$('#q').value.trim().toLowerCase();
    const h=SERVERS.map((s,i)=>[s,i]).filter(x=>x[0].toLowerCase().includes(q)).map(x=>'<button class="srv glass" onclick="pickServer('+x[1]+')"><span>'+x[0]+'</span><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>').join('');
    $('#grid').innerHTML=h||'<div class="empty">Сервер не найден. Попробуйте другое название.</div>';
  };
  $('#q').addEventListener('input',draw);draw();
}
function pickServer(i){st.server=SERVERS[i];st.recv='trade';renderOrder();go('order')}

/* order */
const rateFor=q=>50;
function renderOrder(){
  const buy=st.mode==='buy';
  $('#order').innerHTML=head('Оформление заказа',buy?'Купить вирты':'Продать вирты')+
  '<div class="card glass"><div class="kv"><span>Игра</span><b>'+st.game.name+'</b></div><div class="kv"><span>Сервер</span><b>'+st.server+'</b></div><div class="kv"><span>'+(buy?'Получение':'Передача')+'</span><b id="rv">Трейдом</b></div></div>'+
  '<input class="fld" id="nick" placeholder="Введите игровой ник" autocomplete="off" maxlength="40">'+
  '<div class="blk glass"><h3>'+(buy?'Способ получения':'Способ передачи')+'</h3><div class="seg"><button id="b-trade" class="act" onclick="setRecv(\'trade\')">'+(buy?'Получить трейдом':'Передам трейдом')+'</button><button id="b-bank" onclick="setRecv(\'bank\')">'+(buy?'Получить банком':'Передам банком')+'</button></div><p class="hint" id="rh"></p></div>'+
  (buy?'<input class="fld" id="promo" placeholder="Промокод (необязательно)" autocomplete="off">':'')+
  '<label class="fl" for="qty">Количество валюты (кк)</label><input class="fld" id="qty" inputmode="decimal" placeholder="Например, 10" autocomplete="off">'+
  '<label class="fl" for="sum">'+(buy?'Сумма оплаты (₽)':'Желаемая сумма (₽, необязательно)')+'</label><input class="fld" id="sum" inputmode="decimal" placeholder="Например, 450" autocomplete="off">'+
  (buy?''+
   '<div class="card glass"><div class="kv"><span>Курс</span><b id="r-rate">50 ₽ / 1кк</b></div><div class="kv"><span>Сумма без промокода</span><b id="r-raw">0 ₽</b></div><div class="kv"><span>Скидка по промокоду</span><b>0 ₽</b></div><div class="kv tot"><span>К оплате</span><b id="r-tot">0 ₽</b></div></div>'
   :'<p class="hint" style="margin:0 0 14px">Цену продажи подтвердит менеджер в чате.</p>')+
  '<button class="btn pri" onclick="submit()">'+(buy?'Купить':'Продать')+'</button><p class="note">'+(buy?'Можно ввести либо количество виртов, либо сумму в рублях — второе поле пересчитается автоматически.':'После нажатия откроется чат с менеджером с готовой заявкой.')+'</p>';
  setRecv('trade');
  $('#qty').addEventListener('input',()=>{
    if(buy){const q=num($('#qty').value);$('#sum').value=q>0?Math.round(q*rateFor(q)):''}
    upd();
  });
  if(buy)$('#sum').addEventListener('input',()=>{
    const a=num($('#sum').value);let q=a/50;
    $('#qty').value=a>0?String(Math.round(q*100)/100):'';upd();
  });
  ['nick','qty','sum'].forEach(id=>$('#'+id).addEventListener('input',e=>e.target.classList.remove('bad')));
}
function setRecv(r){
  st.recv=r;const buy=st.mode==='buy';
  $('#b-trade').classList.toggle('act',r==='trade');$('#b-bank').classList.toggle('act',r==='bank');
  $('#rv').textContent=r==='trade'?'Трейдом':'Банком';
  $('#rh').textContent='Выдача будет отмечена как '+(r==='trade'?'трейд.':'передача через банк.');
  if(!buy)$('#rh').textContent='Передача будет отмечена как '+(r==='trade'?'трейд.':'передача через банк.');
}
function upd(){
  if(st.mode!=='buy')return;
  const q=num($('#qty').value),t=q>0?Math.round(q*rateFor(q)):0;
  $('#r-raw').textContent=fmt(t)+' ₽';$('#r-tot').textContent=fmt(t)+' ₽';
}
function submit(){
  const buy=st.mode==='buy',nick=$('#nick').value.trim(),q=num($('#qty').value),a=num($('#sum').value);
  if(!nick){$('#nick').classList.add('bad');$('#nick').focus();return toast('Введите игровой ник')}
  if(!(q>0)){$('#qty').classList.add('bad');$('#qty').focus();return toast('Укажите количество валюты')}
  const promo=buy?$('#promo').value.trim():'';
  const sum=buy?Math.round(q*rateFor(q)):a;
  const L=['Здравствуйте! Хочу '+(buy?'купить':'продать')+' вирты.',
   'Игра: '+st.game.name,'Сервер: '+st.server,'Ник: '+nick,
   (buy?'Получение: ':'Передача: ')+(st.recv==='trade'?'трейдом':'банком'),
   'Количество: '+fmt(q)+' кк'];
  if(sum>0)L.push((buy?'Сумма к оплате: ':'Желаемая сумма: ')+fmt(sum)+' ₽');
  if(promo)L.push('Промокод: '+promo);
  chat(L.join('\n'));
}
</script>
</body>
</html>
